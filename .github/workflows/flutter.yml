name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-windows:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/vanithabodhini-windows-x64.zip

      - name: Upload runnable zip
        uses: actions/upload-artifact@v7
        with:
          name: vanithabodhini-windows-x64
          path: dist/vanithabodhini-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          # archive: false keeps the file as a raw .exe instead of zipping it,
          # so the artifact is downloadable as vanithabodhini.exe.
          path: build/windows/x64/runner/Release/vanithabodhini.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
